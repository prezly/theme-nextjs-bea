upstream varnish_backend {
    server varnish:80;

    # Reuse upstream TCP connections. Without a pool, sustained asset traffic
    # exhausts nginx's ephemeral source ports while closed sockets wait in
    # TIME_WAIT.
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    location = /__health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never trust a caller-provided runtime environment. This value is
        # generated from the host .env before nginx starts.
        proxy_set_header X-Prezly-Env $prezly_runtime_environment;
        proxy_set_header X-Newsroom-Uuid $prezly_newsroom_uuid;
        proxy_set_header X-Newsroom-Theme $prezly_newsroom_theme;

        proxy_pass http://varnish_backend;
    }
}
